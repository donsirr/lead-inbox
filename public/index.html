<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a Service</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <h1>Request a service</h1>
    <p class="sub">Tell us what you need and we'll get back to you.</p>

    <div id="alert" class="alert" role="status" aria-live="polite"></div>

    <form id="lead-form" class="panel" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name" maxlength="100" required>
      <p class="field-error" id="name-error"></p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <p class="field-error" id="email-error"></p>

      <label for="phone">Phone <span class="opt">(optional)</span></label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="50">
      <p class="field-error" id="phone-error"></p>

      <label for="service">Service</label>
      <select id="service" name="service" required>
        <option value="">Choose a service…</option>
        <option value="cleaning">Cleaning</option>
        <option value="repair">Repair</option>
        <option value="consultation">Consultation</option>
        <option value="other">Other</option>
      </select>
      <p class="field-error" id="service-error"></p>

      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="2000" required></textarea>
      <p class="field-error" id="message-error"></p>

      <div class="actions"><button type="submit" id="submit">Send request</button></div>
    </form>
  </main>
  <script src="/form.js"></script>
</body>
</html>
